services:
  db:
    image: postgres:16
    environment: { POSTGRES_PASSWORD: localdev, POSTGRES_DB: locodb }
    ports: ["5432:5432"]
    volumes:
      - ./supabase/migrations/0001_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./supabase/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
